
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <div class="todo-card">

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    maxlength="150"
                    required
                >

                <button type="submit" id="addBtn">
                    Add Task
                </button>
            </form>

            <div class="task-info">
                <h3>Your Tasks</h3>
                <span id="taskCount">0 tasks</span>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="pending">
                    Pending
                </button>

                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <ul id="taskList"></ul>

            <div id="emptyMessage">
                No tasks yet. Add your first task!
            </div>

            <div class="footer">
                <span id="remainingCount">0 tasks remaining</span>

                <button id="clearCompleted">
                    Clear Completed
                </button>
            </div>

        </div>

        <p class="copyright">
            BCA Mini Project | To-Do List Application
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
